name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json declares >=20; this is what Vercel resolves to.
          node-version: "20.x"
          cache: npm

      # ci, not install: it installs exactly the lockfile and fails loudly if
      # package.json and the lock have drifted apart. That drift is what breaks
      # a deployment build after a dependency change lands without the lock.
      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # CI=true turns warnings into errors, so an unused import cannot reach a
      # deployment. This is the same build Vercel runs.
      - name: Build
        run: npm run build
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci

      # Only chromium: both projects are Chromium, one of them wearing a
      # Pixel 7. --with-deps pulls the system libraries the runner lacks.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          CI: true

      # The server is started here rather than by Playwright so the run has
      # nothing to tear down at the end: the job ends, the runner goes away.
      # It serves ./build, so the tests measure the bundle the deployment
      # ships. Nothing answers /api behind it, and nothing has to — the tests
      # stub the two routes the login page calls.
      - name: Serve the build
        run: |
          npx serve --single --listen 3000 build &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true
          E2E_BASE_URL: http://localhost:3000

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
